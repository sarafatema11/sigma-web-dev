<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excercise 5 Desiging layout</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        header {
            position: sticky;
            top: 0;
        }

        nav {
            background-color: pink;
            height: 83px;
        }

        ul li {
            list-style: none;
            display: inline-flex;
            padding: 23px;
            font-weight: bold;
            font-size: 35px;
            gap: 600px;

        }

        main {
            background-color: black;
            color: white;
            padding: 34px;
        }


        .container {
            background-color: green;
            margin: 12px 34px;
            text-align: center;
            padding: 55px 23px;
        }

        .box1 {
            background-color: palevioletred;
            height: 70vh;
            width: 45%;
            display: inline-flex;
            margin: 0 12px;
        }

        .box2 {
            background-color: rgb(70, 213, 239);
            height: 70vh;
            width: 45%;
            display: inline-flex;
            margin: 0 12px;
        }

        .text-box {
            padding: 28px 3px;
            border: 2px solid white;
            margin: 50px 34vw;
            font-size: 2em;
            border-radius: 30px;
            text-align: center;
            height: 100px;
            width: 600px;
        }

        .text-box p {
            font-size: 50px;
            margin: 18px;
            padding: 0px 7px;
            margin: 12px 5px;
        }

        .orange-box {
            position: fixed;
            background-color: orange;
            height: 32px;
            width: 32px;
            bottom: 12px;
            right: 23px;
            border-radius: 60px;
        }

        footer {
            height: 100px;
            background-color: bisque
        }

        footer p {
            color: black;
            text-align: center;
            font-size: 34px;
            padding: 23px;

        }
    </style>
</head>

<body>
    <header>
        <nav>
            <ul>
                <li>Home</li>
                <li>About</li>
                <li>Contact</li>
            </ul>
        </nav>
    </header>

    <main>

        <div class="container">
            <div class="box1"></div>
            <div class="box2"></div>
        </div>
        <div class="text-box">
            <p>Welcome to this Sigma Web Development Express</p>
        </div>
        <div class="orange-box"></div>
    </main>

    <footer>
        <p>All Copyright Reserved @ 2026</p>
    </footer>
</body>
</html>
