<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex :13 Dynamic Website builder </title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0f0f0f;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 90%;
            margin: 30px auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 10px;
            background-color: #1f1f1f;
            border-radius: 10px;
        }

        .thumbnail {
            position: relative;
            flex-shrink: 0;
        }

        .thumbnail img {
            width: 200px;
            display: block;
            border-radius: 8px;
        }

        .duration {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background-color: black;
            color: white;
            padding: 4px 6px;
            font-size: 12px;
            border-radius: 4px;
        }

        .details h3 {
            font-size: 18px;
            margin-bottom: 10px;
        }

        .details p {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 6px;
        }
    </style>
</head>

<body>
    <div class="container">

        <!-- design a same card using card.png file & using javascript methods DOM methods & properties. after reload / refresh new card appear with thumbnail, title, channel Name, views,  How many months old this video (Months old) etc. -->

        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
