<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecxercise 5 solution</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        header {
            position: sticky;
            top: 0;
        }

        nav {
            background-color: rgb(0, 187, 255);
            height: 111px;
        }

        ul li {
            list-style: none;
            display: inline-flex;
            padding: 23px;
            font-size: 20px;
            font-family: serif;
            margin: 23px;
            font-weight: bold;
            gap: 60px;
        }

        main {
            background-color: rgb(175, 207, 224);
            color: black;
            padding: 34px;
        }

        .container {
            background-color: green;
            border: 2px solid black;
            height: 90vh;
            width: 95vw;
            margin: 3px;
        }

        .box1 {
            border: 2px solid black;
            height: 550px;
            width: 600px;
            float: left;
            margin: 23px;
            padding: 23px;
            background-color: rgb(236, 87, 189);
            display: inline-block;
        }


        .box2 {
            border: 2px solid black;
            height: 550px;
            width: 600px;
            float: right;
            margin: 23px;
            padding: 23px;
            background-color: rgb(115, 237, 235);
            display: inline-block;
        }



        .content {
            border: 2px solid black;
            height: 50px;
            padding: 34px;
            margin: 50px 34vw;
            width: 32vw;
            font-size: 34px;
            align-items: center;
            border-radius: 34px;
            text-align: center;
        }


        .orange-icon {
            position: fixed;
            background-color: rgb(94, 53, 227);
            height: 32px;
            width: 32px;
            bottom: 12px;
            right: 23px;
            /* border: 1px solid black; */
            border-radius: 60px;

        }

        footer {
            height: 135px;
            background-color: plum;
            bottom: 23px;
        }

        footer p {
            padding: 45px;
            font-size: 25px;
            text-align: center;

        }
    </style>
</head>

<body>
    <header>
        <nav>
            <ul>
                <li>Home</li>
                <li>About</li>
                <li>Contact</li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="container">
            <div class="box1"></div>
            <div class="box2"></div>
        </div>

        <div class="content">
            <p>Welcome to Sigma Web Development Express</p>
        </div>

        <div class="orange-icon"></div>
    </main>

    <footer>
        <p>
            All Copy Rights Reserved @ 2026
        </p>
    </footer>
</body>
</html>
